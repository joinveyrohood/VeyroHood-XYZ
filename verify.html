<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VeyroHood XYZ — Verify</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="verify">
<div class="wrap">
<nav>
  <a class="logo" href="index.html">VEYROHOOD<small>XYZ WHITELIST</small></a>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="missions.html" data-gate="missions">Missions</a>
    <a class="active" href="verify.html">Verify</a>
    <a href="dashboard.html" data-gate="dashboard">Dashboard</a>
    <a href="how.html">How</a>
  </div>
</nav>
<section class="hero" style="grid-template-columns:1fr">
  <div>
    <div class="kicker">VERIFY</div>
    <h1>LOCK YOUR <i>SEAT.</i></h1>
    <p class="lead">One wallet. One seat.</p>
  </div>
</section>
<section class="panel">
  <button class="btn" id="connectBtn" type="button">CONNECT WALLET</button>
  <div id="walletPick" class="pick"></div>
  <p class="muted">Phone: open this page in your wallet app.</p>
  <div id="walletApps" class="pick"></div>
  <p id="walletLine" class="muted"></p>
  <label>X username</label><input id="xUser" placeholder="VeyroHood">
  <label>Discord username</label><input id="discordUser" placeholder="name">
  <label>Quote link</label><input id="quoteLink" placeholder="https://x.com/...">
  <label>Reply link</label><input id="replyLink" placeholder="https://x.com/...">
  <label>Referral code</label><input id="referralCode" placeholder="optional">
  <label>Network</label>
  <select id="chain"><option value="11155111">Sepolia testnet</option></select>
  <div class="actions" style="margin-top:14px">
    <button class="btn" id="saveBtn" type="button">SAVE DETAILS</button>
    <button class="btn ghost" id="payBtn" type="button">PAY</button>
  </div>
  <label>Already paid? Transaction hash</label><input id="txHash" placeholder="0x...">
  <button class="btn ghost" id="recheckBtn" type="button">RECHECK</button>
  <p id="status" class="muted"></p>
</section>
<footer><span>VeyroHood XYZ</span><span>20%</span></footer>
</div>
<script src="gate.js"></script>
<script src="wallet.js"></script>
<script>
const status=document.getElementById("status");
const savedRef=(new URLSearchParams(location.search).get("ref")||vhSavedRef()||"").trim();
if(savedRef) document.getElementById("referralCode").value=savedRef;
renderWalletApps("walletApps");
document.getElementById("connectBtn").onclick=()=>connectFlow("walletPick",(w,name)=>{
  document.getElementById("walletLine").textContent=w.slice(0,6)+"..."+w.slice(-4)+" · "+name;
},msg=>status.textContent=msg);
async function saveDetails(){
  if(!window.VH.wallet){status.textContent="Connect wallet first.";return;}
  const body={wallet_address:window.VH.wallet,x_username:document.getElementById("xUser").value,discord_username:document.getElementById("discordUser").value,quote_link:document.getElementById("quoteLink").value,reply_link:document.getElementById("replyLink").value,referral_code:document.getElementById("referralCode").value};
  const data=await (await fetch(API_URL+"/api/verify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})).json();
  status.textContent=data.error||"Saved";
  return data;
}
document.getElementById("saveBtn").onclick=saveDetails;
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
async function check(tx){
  for(let i=0;i<8;i++){
    const data=await (await fetch(API_URL+"/api/verify-payment",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({wallet:window.VH.wallet,txHash:tx,chainId:11155111})})).json();
    const msg=data.error||data.message||(data.success?"Verified":"Check failed");
    if(data.success && data.paymentVerified){
      status.textContent="Seat locked.";
      vhMarkVerified();
      setTimeout(()=>location.href="dashboard.html",800);
      return data;
    }
    if(data.success && data.ogNumber){
      status.textContent="Already verified.";
      vhMarkVerified();
      setTimeout(()=>location.href="dashboard.html",800);
      return data;
    }
    if(/not found|TX_PENDING|Wait and tap/i.test(msg) && i<7){
      status.textContent="Waiting... "+(i+1)+"/8";
      await sleep(4000);
      continue;
    }
    status.textContent=msg;
    return data;
  }
}
document.getElementById("payBtn").onclick=async()=>{
  if(!window.VH.wallet){status.textContent="Connect wallet first, then Pay.";return;}
  status.textContent="Opening wallet...";
  try{
    const tx=await payUsdg();
    document.getElementById("txHash").value=tx;
    status.textContent="Checking...";
    await saveDetails();
    await check(tx);
  }catch(e){status.textContent=e.message||"Wallet did not open.";}
};
document.getElementById("recheckBtn").onclick=()=>check(document.getElementById("txHash").value.trim());
</script>
</body>
</html>
